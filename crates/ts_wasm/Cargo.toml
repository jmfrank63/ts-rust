# The wasm build of ts_goport: tsc over a file system that the JavaScript
# host provides. npm/wasm loads it; scripts/wasm/build.sh builds it.
[package]
name = "ts_wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Only a cdylib: cargo does not run LTO for a lib that is also an rlib, so
# the `wasm` profile's fat LTO needs this (270 KB smaller).
[lib]
crate-type = ["cdylib"]

[features]
# The memory soaks of the multi-run flow (src/soak.rs): `#[ignore]` tests
# and an allocation-site trace, whose wasm build imports the `soak` module
# of scripts/wasm/soak-runner.mjs. Measurement only; CI builds without it.
soak = []

[dependencies]
ts_goport = { path = "../ts_goport", default-features = false }

# Not the workspace lints: this crate is the wasm ABI, and its exports need
# `#[unsafe(no_mangle)]` and its imports an `unsafe extern` block. All other
# code here is safe.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
